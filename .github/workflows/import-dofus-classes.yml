name: Import class portraits
on:
  push:
    branches: [agent/initial-scaffold]
    paths:
      - 'scripts/import_dofus_classes.py'
      - '.github/workflows/import-dofus-classes.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/initial-scaffold
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/import_dofus_classes.py
      - name: Commit local portraits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/classes/*.png
          if ! git diff --cached --quiet; then
            git commit -m "assets(classes): add 19 local class portraits"
            git push origin HEAD:agent/initial-scaffold
          fi
