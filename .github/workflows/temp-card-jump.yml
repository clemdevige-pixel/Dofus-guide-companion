name: Temp card jump patch

on:
  push:
    branches:
      - agent/temp-ui-card-jump
    paths:
      - .github/workflows/temp-card-jump.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/temp-ui-card-jump
      - name: Apply patch
        run: python scripts/temp_card_jump_patch.py
      - name: Commit patch
        run: |
          git config user.name "openai-agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git add src/App.tsx src/styles.css
          git commit -m "feat(ui): add direct card navigation"
          git push origin HEAD:agent/temp-ui-card-jump
