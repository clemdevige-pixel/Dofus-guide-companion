name: Temp completion visuals patch

on:
  push:
    branches:
      - agent/fix-completion-visuals
    paths:
      - .github/workflows/temp-completion-visuals.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-completion-visuals
      - name: Patch completion visuals
        run: python scripts/temp_completion_visuals_patch.py
      - name: Commit patch
        run: |
          git config user.name "openai-agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git add src/App.tsx src/styles.css
          git commit -m "fix(ui): show completed cards consistently"
          git push origin HEAD:agent/fix-completion-visuals
