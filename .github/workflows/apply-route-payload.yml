name: Apply route payload

on:
  push:
    branches:
      - agent/initial-scaffold
    paths:
      - .route-payload.b64

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/initial-scaffold

      - name: Decode generated route
        run: base64 -d .route-payload.b64 | gzip -d > data/route.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Test route logic
        run: pnpm test:route

      - name: Validate route data
        run: pnpm validate:route

      - name: Build frontend
        run: pnpm build

      - name: Commit generated route and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/route.json
          git rm .route-payload.b64 .github/workflows/apply-route-payload.yml
          git commit -m "chore(route): sync optimized roadmap"
          git push origin HEAD:agent/initial-scaffold
