name: Apply route payload

on:
  push:
    branches:
      - agent/initial-scaffold
    paths:
      - '.route-payload.part*'
      - '.github/workflows/apply-route-payload.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/initial-scaffold

      - name: Decode generated route
        run: |
          cat \
            .route-payload.part01a \
            .route-payload.part01b \
            .route-payload.part01c \
            .route-payload.part02 \
            .route-payload.part03 \
            .route-payload.part04 \
            .route-payload.part05a \
            .route-payload.part05b \
            .route-payload.part05c \
            .route-payload.part06 \
            .route-payload.part07a \
            .route-payload.part07b \
            .route-payload.part07c \
            .route-payload.part08a \
            | base64 -d \
            | gzip -d \
            > data/route.json
          echo '601d649d79e7694bd00e2df7379ce75c37f0025b9745838ca39b1eba9880da82  data/route.json' | sha256sum -c -

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Test route logic
        run: pnpm test:route

      - name: Validate route data
        run: pnpm validate:route

      - name: Build frontend
        run: pnpm build

      - name: Commit generated route and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/route.json
          git rm -f .route-payload.b64 .route-payload.part* .github/workflows/apply-route-payload.yml
          git commit -m "chore(route): sync optimized roadmap"
          git push origin HEAD:agent/initial-scaffold
