name: Sync route temp

on:
  push:
    branches:
      - agent/initial-scaffold
    paths:
      - '.github/workflows/sync-route-temp.yml'

permissions:
  contents: write

jobs:
  sync-route:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Export route from Google Sheet
        env:
          ROUTE_SHEET_ID: 1l1eYM3T708s5j74LmsUi4wyzg6sM9xShPzS_ToBtVYg
          ROUTE_SHEET_RANGE: ROUTE!A5:T
          ROUTE_VERSION: '2026-09-04'
          GOOGLE_ACCESS_TOKEN: ${{ secrets.GOOGLE_ACCESS_TOKEN }}
          GOOGLE_SHEETS_API_KEY: ${{ secrets.GOOGLE_SHEETS_API_KEY }}
        run: pnpm export:route

      - name: Commit generated route
        run: |
          if git diff --quiet -- data/route.json; then
            echo "Route already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/route.json
          git commit -m "chore(route): sync generated route"
          git push
