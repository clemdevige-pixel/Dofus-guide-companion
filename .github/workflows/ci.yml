name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Export verified Sheet snapshot with the official exporter
        run: pnpm export:route
        env:
          NODE_OPTIONS: --import ./.github/verify-sheet-export.mjs
          ROUTE_SHEET_ID: snapshot
          GOOGLE_ACCESS_TOKEN: snapshot
          ROUTE_VERSION: '2026-11-05'

      - name: Check exact Sheet and JSON synchronization
        run: git diff --exit-code -- data/route.json

      - name: Test route logic
        run: pnpm test:route

      - name: Validate route data
        run: pnpm validate:route

      - name: Build frontend
        run: pnpm build

  tauri-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml
