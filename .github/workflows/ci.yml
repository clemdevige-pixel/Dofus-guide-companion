          Path('src/progress/storage.ts').write_text("""const STORAGE_KEY = 'dofus-guide-companion.progress.v1';

export interface ProgressState {
  completedStepIds: string[];
  checkedPreparationItemIds: string[];
  compact: boolean;
  currentStepId?: string;
  routeVersion?: string;
}

interface ProgressStorage {
  getItem(key: string): string | null;
  setItem(key: string, value: string): void;
}

const defaultState: ProgressState = {
  completedStepIds: [],
  checkedPreparationItemIds: [],
  compact: false,
};

export function parseProgress(raw: string | null): ProgressState {
  if (!raw) return defaultState;

  try {
    const parsed = JSON.parse(raw) as Partial<ProgressState>;
    return {
      completedStepIds: Array.isArray(parsed.completedStepIds)
        ? parsed.completedStepIds.filter((id): id is string => typeof id === 'string')
        : [],
      checkedPreparationItemIds: Array.isArray(parsed.checkedPreparationItemIds)
        ? parsed.checkedPreparationItemIds.filter((id): id is string => typeof id === 'string')
        : [],
      compact: typeof parsed.compact === 'boolean' ? parsed.compact : false,
      ...(typeof parsed.currentStepId === 'string' && parsed.currentStepId
        ? { currentStepId: parsed.currentStepId }
        : {}),
      ...(typeof parsed.routeVersion === 'string' && parsed.routeVersion
        ? { routeVersion: parsed.routeVersion }
        : {}),
    };
  } catch {
    return defaultState;
  }
}

export function loadProgress(storage: ProgressStorage = window.localStorage): ProgressState {
  try {
    return parseProgress(storage.getItem(STORAGE_KEY));
  } catch {
    return defaultState;
  }
}

export function saveProgress(
  state: ProgressState,
  storage: ProgressStorage = window.localStorage,
): void {
  storage.setItem(STORAGE_KEY, JSON.stringify(state));
}
""", encoding='utf-8')

          Path('src/progress/reconcile.ts').write_text("""import { getPreparationItemKey } from '../route/preparation';
import { getSortedSteps } from '../route/selectors';
import type { RouteDocument } from '../route/types';
import type { ProgressState } from './storage';

/** Reconciles persisted progress with the currently bundled route. */
export function reconcileProgressWithRoute(
  route: RouteDocument,
  progress: ProgressState,
): ProgressState {
  const sortedSteps = getSortedSteps(route);
  const stepIndexById = new Map(sortedSteps.map((step, index) => [step.id, index]));
  const validStepIds = new Set(route.steps.map((step) => step.id));
  const completedStepIds = new Set(
    progress.completedStepIds.filter((stepId) => validStepIds.has(stepId)),
  );
  const routeChanged = progress.routeVersion !== route.routeVersion;

  let currentStepId =
    progress.currentStepId && stepIndexById.has(progress.currentStepId)
      ? progress.currentStepId
      : undefined;

  let anchorIndex = currentStepId ? stepIndexById.get(currentStepId) ?? -1 : -1;
  if (anchorIndex < 0) {
    for (const stepId of completedStepIds) {
      const index = stepIndexById.get(stepId);
      if (index !== undefined && index > anchorIndex) anchorIndex = index;
    }
  }

  if (routeChanged && anchorIndex >= 0) {
    for (let index = 0; index < anchorIndex; index += 1) {
      const step = sortedSteps[index];
      if (step.type === 'preparation') completedStepIds.add(step.id);
    }

    if (!currentStepId) {
      currentStepId = sortedSteps
        .slice(anchorIndex + 1)
        .find((step) => !completedStepIds.has(step.id))?.id;
    }
  }

  const validPreparationItemIds = new Set<string>();
  for (const step of route.steps) {
    for (let itemIndex = 0; itemIndex < (step.preparationItems?.length ?? 0); itemIndex += 1) {
      validPreparationItemIds.add(getPreparationItemKey(step.id, itemIndex));
    }
  }

  return {
    completedStepIds: [...completedStepIds],
    checkedPreparationItemIds: routeChanged
      ? []
      : progress.checkedPreparationItemIds.filter((itemId) => validPreparationItemIds.has(itemId)),
    compact: progress.compact,
    ...(currentStepId ? { currentStepId } : {}),
    routeVersion: route.routeVersion,
  };
}
""", encoding='utf-8')

          Path('src/progress/reconcile.test.ts').write_text("""import assert from 'node:assert/strict';
import test from 'node:test';
import type { RouteDocument } from '../route/types';
import { reconcileProgressWithRoute } from './reconcile';
import type { ProgressState } from './storage';

const route: RouteDocument = {
  schemaVersion: 1,
  routeVersion: '2026-09-16',
  title: 'Test route',
  blocks: [{ id: 'block-01', order: 1, title: 'Block' }],
  steps: [
    { id: 'prep-before', order: 1, blockId: 'block-01', type: 'preparation', title: 'Prepare before', preparationItems: [{ kind: 'resource', quantity: 1, name: 'Resource A' }] },
    { id: 'quest-1', order: 2, blockId: 'block-01', type: 'quest', title: 'Quest 1' },
    { id: 'prep-middle', order: 3, blockId: 'block-01', type: 'preparation', title: 'Prepare middle', preparationItems: [{ kind: 'resource', quantity: 1, name: 'Resource B' }] },
    { id: 'quest-2', order: 4, blockId: 'block-01', type: 'quest', title: 'Quest 2' },
  ],
};

function makeProgress(overrides: Partial<ProgressState> = {}): ProgressState {
  return { completedStepIds: [], checkedPreparationItemIds: [], compact: false, ...overrides };
}

test('route migration preserves métier progress and closes historical preparation cards', () => {
  const migrated = reconcileProgressWithRoute(route, makeProgress({
    completedStepIds: ['quest-1', 'removed-old-prep'],
    checkedPreparationItemIds: ['removed-old-prep:0', 'prep-before:0'],
    currentStepId: 'quest-2',
  }));

  assert.deepEqual(new Set(migrated.completedStepIds), new Set(['quest-1', 'prep-before', 'prep-middle']));
  assert.equal(migrated.currentStepId, 'quest-2');
  assert.deepEqual(migrated.checkedPreparationItemIds, []);
  assert.equal(migrated.routeVersion, route.routeVersion);
});

test('same route version does not auto-complete an intentionally unchecked preparation', () => {
  const reconciled = reconcileProgressWithRoute(route, makeProgress({
    completedStepIds: ['quest-1'],
    checkedPreparationItemIds: ['prep-before:0', 'stale:0'],
    currentStepId: 'quest-2',
    routeVersion: route.routeVersion,
  }));

  assert.deepEqual(reconciled.completedStepIds, ['quest-1']);
  assert.deepEqual(reconciled.checkedPreparationItemIds, ['prep-before:0']);
});

test('removed saved cursor resumes after the furthest surviving completed step', () => {
  const migrated = reconcileProgressWithRoute(route, makeProgress({
    completedStepIds: ['quest-1'],
    currentStepId: 'removed-old-prep',
  }));

  assert.deepEqual(new Set(migrated.completedStepIds), new Set(['quest-1', 'prep-before']));
  assert.equal(migrated.currentStepId, 'prep-middle');
});
""", encoding='utf-8')

