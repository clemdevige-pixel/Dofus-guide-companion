name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Materialize optimized route
        run: node scripts/materialize-route.cjs

      - name: Test route logic
        run: pnpm test:route

      - name: Validate route data
        run: pnpm validate:route

      - name: Build frontend
        run: pnpm build

      - name: Commit generated route
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- data/route.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/route.json
            git commit -m "data(route): materialize optimized route"
            git push
          fi

  tauri-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml
