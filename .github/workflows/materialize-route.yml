name: Materialize route

on:
  push:
    branches:
      - agent/initial-scaffold
    paths:
      - .github/workflows/materialize-route.yml
      - .route-transfer/**

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/initial-scaffold

      - name: Rebuild and validate route.json
        shell: bash
        run: |
          set -euo pipefail
          cat .route-transfer/part-* > /tmp/route.gz.b64
          base64 --decode /tmp/route.gz.b64 | gzip --decompress > data/route.json

          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const route = JSON.parse(fs.readFileSync('data/route.json', 'utf8'));

          const assertions = [
            [route.schemaVersion === 1, `schemaVersion=${route.schemaVersion}`],
            [route.routeVersion === '2026-09-03', `routeVersion=${route.routeVersion}`],
            [route.blocks?.length === 21, `blocks=${route.blocks?.length}`],
            [route.steps?.length === 957, `steps=${route.steps?.length}`],
            [route.steps?.[0]?.id === 'route-step-0002', `first=${route.steps?.[0]?.id}`],
            [route.steps?.at(-1)?.id === 'route-step-0999', `last=${route.steps?.at(-1)?.id}`],
          ];

          for (const [ok, message] of assertions) {
            if (!ok) throw new Error(`Route export invariant failed: ${message}`);
          }

          const stepIds = new Set();
          for (const step of route.steps) {
            if (stepIds.has(step.id)) throw new Error(`Duplicate step id: ${step.id}`);
            stepIds.add(step.id);
          }

          const sha256 = crypto
            .createHash('sha256')
            .update(fs.readFileSync('data/route.json'))
            .digest('hex');

          console.log(`route.json validated: ${route.blocks.length} blocks / ${route.steps.length} steps`);
          console.log(`sha256=${sha256}`);
          NODE

      - name: Commit generated route
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/route.json
          if git diff --cached --quiet; then
            echo "data/route.json already up to date"
            exit 0
          fi
          git commit -m "data: export route from Google Sheet"
          git push origin HEAD:agent/initial-scaffold
