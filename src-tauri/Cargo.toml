[package]
name = "dofus-guide-companion"
version = "0.1.0"
description = "Dofus Guide Companion"
authors = ["clemdevige-pixel"]
edition = "2021"

[lib]
name = "dofus_guide_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
